name: patch linux libs

# The Linux archives cannot be re-linked from macOS, so this job does it on a
# Linux runner, proves the C API still links, and only then tags the release
# that consumers pin. Run once per patch (see PATCHED.md).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install binutils and a cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils gcc-aarch64-linux-gnu

      - name: Strip LTO bitcode
        run: |
          bash tools/no-lto.sh x86_64-unknown-linux-musl
          bash tools/no-lto.sh aarch64-unknown-linux-musl

      - name: Link-test the C API out of each archive
        run: |
          set -euo pipefail
          test_arch() {
            lib="libs/$1/libloro.a"
            sym=$(nm --defined-only -g "$lib" | awk '$2=="T" && $3 ~ /^ffi_loro/{print $3; exit}')
            [ -n "$sym" ] || { echo "no ffi_loro symbol in $lib" >&2; exit 1; }
            printf 'int %s(void);\nint main(void){ return %s() == 0; }\n' "$sym" "$sym" > /tmp/linktest.c
            "$2" -o /tmp/linktest /tmp/linktest.c "$lib" -lpthread -ldl -lm
            echo "ok: $1 links ($sym resolved)"
          }
          test_arch x86_64-unknown-linux-musl cc
          test_arch aarch64-unknown-linux-musl aarch64-linux-gnu-gcc

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "calionauta"
          git config user.email "calionauta@users.noreply.github.com"
          git add libs
          git commit -m "build: ship libloro.a without LTO bitcode

Go 1.27.4 refuses LTO IR in cgo linker inputs. Every object here also carries
machine code, so the IR is redundant; the exported ffi_loro API is unchanged."
          git tag v0.5.1
          git push origin HEAD:main
          git push origin v0.5.1
